name: Container builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate public setup scripts
        run: |
          bash -n scripts/setup.sh
          pwsh -NoProfile -Command '
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/setup.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          '

      - name: Prepare Compose CI environment through public bootstrap
        run: |
          ci_env_file="${GITHUB_WORKSPACE}/.env.scopeharbor-ci"
          ./scripts/setup.sh --bootstrap-only --env-file .env.scopeharbor-ci
          printf 'SCOPEHARBOR_CI_ENV_FILE=%s\n' "$ci_env_file" >> "$GITHUB_ENV"

      - name: Validate Compose configuration and runtime environment
        run: |
          SCOPEHARBOR_ENV_FILE="$SCOPEHARBOR_CI_ENV_FILE" docker compose --env-file "$SCOPEHARBOR_CI_ENV_FILE" config --quiet
          SCOPEHARBOR_ENV_FILE="$SCOPEHARBOR_CI_ENV_FILE" docker compose --env-file "$SCOPEHARBOR_CI_ENV_FILE" config --format json | python3 -c '
          import json, sys
          environment = json.load(sys.stdin)["services"]["backend"]["environment"]
          required = ("AUTH_PROFILE_SECRET_KEY", "DEV_AUTH_TOKEN", "SCAN_RELAY_SECRET", "SCAN_RELAY_URL", "ZAP_API_KEY")
          missing = [name for name in required if not environment.get(name)]
          assert not missing, f"Backend runtime environment is incomplete: {missing}"
          '

      - name: Enforce Compose network and privilege boundaries
        run: |
          set -a
          source "$SCOPEHARBOR_CI_ENV_FILE"
          set +a
          SCOPEHARBOR_ENV_FILE="$SCOPEHARBOR_CI_ENV_FILE" python3 scripts/check_compose_hardening.py

      - name: Build API image
        run: docker build --file backend/Dockerfile --target api --tag scopeharbor-api:ci .

      - name: Build scanner worker image
        run: docker build --file backend/Dockerfile --target worker --tag scopeharbor-worker:ci .

      - name: Build guarded relay image
        run: docker build --file backend/Dockerfile --target relay --tag scopeharbor-relay:ci .

      - name: Build frontend image
        run: >-
          docker build --file frontend/Dockerfile --tag scopeharbor-frontend:ci
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          --build-arg NEXT_PUBLIC_DEV_AUTH_TOKEN=scopeharbor-ci-development-token .

      - name: Scan images with digest-pinned Trivy
        run: |
          trivy_cache="${RUNNER_TEMP}/scopeharbor-trivy-cache"
          mkdir -p "$trivy_cache"
          for image in scopeharbor-api:ci scopeharbor-worker:ci scopeharbor-relay:ci scopeharbor-frontend:ci; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$trivy_cache:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
              image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$image"
          done

      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p "${{ runner.temp }}/scopeharbor-sbom"
          for image in api worker relay frontend; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "${{ runner.temp }}/scopeharbor-sbom:/output" \
              --volume "${{ runner.temp }}/scopeharbor-trivy-cache:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
              image --format cyclonedx --output "/output/$image.cdx.json" "scopeharbor-$image:ci"
            test -s "${{ runner.temp }}/scopeharbor-sbom/$image.cdx.json"
          done

      - name: Upload CycloneDX SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scopeharbor-image-sboms
          path: ${{ runner.temp }}/scopeharbor-sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Compose readiness smoke test
        run: |
          compose_ci() {
            SCOPEHARBOR_ENV_FILE="$SCOPEHARBOR_CI_ENV_FILE" docker compose --env-file "$SCOPEHARBOR_CI_ENV_FILE" "$@"
          }
          finish() {
            status=$?
            trap - EXIT
            if ((status != 0)); then
              printf '%s\n' 'Compose readiness failed; collecting bounded service diagnostics.' >&2
              compose_ci ps --all >&2 || true
              zap_id="$(compose_ci ps --quiet zap 2>/dev/null || true)"
              if [[ -n "$zap_id" ]]; then
                docker inspect --format '{{json .State.Health}}' "$zap_id" >&2 || true
                docker logs --tail 200 "$zap_id" >&2 || true
              fi
            fi
            SCOPEHARBOR_ENV_FILE="$SCOPEHARBOR_CI_ENV_FILE" docker compose --env-file "$SCOPEHARBOR_CI_ENV_FILE" down --volumes --remove-orphans || true
            exit "$status"
          }
          trap finish EXIT
          ./scripts/setup.sh --skip-osv-update --env-file .env.scopeharbor-ci
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/docs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3001 >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000 >/dev/null
