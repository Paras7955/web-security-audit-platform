targets:
  - id: juice-shop
    name: OWASP Juice Shop
    base_url: "http://juice-shop:3000"
    schemes: ["http"]
    hosts: ["juice-shop"]
    ports: [3000]
    allowed_modes: ["passive", "active_demo", "ajax_short"]
    max_redirects: 5
    local_demo: true
    notes: "Local Docker Compose demo target. From the host browser, use http://localhost:3000."

