[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106", "S108"]

[tool.coverage.run]
branch = true
source = ["app", "worker"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
